# Install as .github/workflows/notify-site.yml in caseyg/caseyagollan-content.
name: Notify website of published content
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SITE_CONTENT_SYNC_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'caseyg', repo: 'caseyagollan.com', event_type: 'content-updated',
              client_payload: { repository: context.repo.owner + '/' + context.repo.repo, branch: 'main', sha: context.sha }
            });
